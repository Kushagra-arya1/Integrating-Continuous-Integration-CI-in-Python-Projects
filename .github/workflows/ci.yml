name: Python Continuous Integration (CI) Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-lint-test:
    name: Lint, Test & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 4. Code Linting (Flake8)
        run: |
          echo "=== Running Flake8 Syntax & Critical Errors Check ==="
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "=== Running Full Flake8 Style & Complexity Check ==="
          flake8 src tests --count --max-complexity=10 --max-line-length=100 --statistics

      - name: 5. Execute Test Suite & Generate Coverage Report
        run: |
          mkdir -p reports
          pytest \
            --cov=mini_calc \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:reports/htmlcov-${{ matrix.python-version }} \
            --cov-fail-under=90 \
            --junitxml=reports/test-results-${{ matrix.python-version }}.xml \
            tests/

      - name: 6. Publish Job Summary to GitHub Actions UI
        if: always()
        run: |
          echo "### 🚀 CI Pipeline Results for Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }} on branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts Generated**: JUnit XML, Cobertura XML, HTML Coverage" >> $GITHUB_STEP_SUMMARY

      - name: 7. Upload Test & Coverage Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14
