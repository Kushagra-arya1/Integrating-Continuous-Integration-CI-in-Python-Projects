[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-calc"
version = "1.0.0"
description = "A lightweight, robust Python library showcasing Continuous Integration (CI)"
readme = "README.md"
authors = [{ name = "Python CI Developer" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mini_calc"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
